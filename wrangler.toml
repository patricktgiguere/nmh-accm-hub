# Cloudflare Worker configuration. The site is static files in public/ served as
# Worker assets, with a small Worker (src/) in front for login checks, the contact
# form, and the admin page.

name = "nmh-accm-hub"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Keep secrets that were set in the Cloudflare dashboard (RESEND_API_KEY, GITHUB_TOKEN).
keep_vars = true

# Non-secret settings. These mirror the dashboard so a Git deploy never drops them.
[vars]
ACCESS_TEAM_DOMAIN = "wandering-scene-8ab6.cloudflareaccess.com"
ACCESS_AUD = "89afa9d4c07b3234f0977f8ff0f7ffa022f268cfbcb7eb6acc7129e76c563430"
CONTACT_TO = "patrick.giguere@nm.org"
CONTACT_FROM = "hub@nmaccm.org"
ADMIN_EMAILS = "patricktgiguere@gmail.com,patrick.giguere@nm.org"
GITHUB_REPO = "patricktgiguere/nmh-accm-hub"
GITHUB_BRANCH = "main"

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker for every request so the login check covers files too.
run_worker_first = true

# Contact form email: sent through Cloudflare Email Routing from hub@nmaccm.org to
# CONTACT_TO, which must be a verified destination address in Email Routing.
[[send_email]]
name = "EMAIL"

# Contact-form rate limiting (optional). Create a KV namespace in the dashboard
# (Storage & Databases > KV), then paste its ID below and remove the leading '#'
# from these three lines. Without it the form still works, without the hourly cap.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "paste-your-namespace-id-here"
